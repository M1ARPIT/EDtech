<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#E6F0FA] text-gray-800 font-sans">
  <!-- My Account Section -->
  <section class="max-w-7xl mx-auto py-10 px-4 md:px-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-3xl font-bold text-gray-900">My Account</h2>
      <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
        Home
      </a>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- My Profiles -->
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-xl font-semibold text-blue-800 mb-4">My Profiles</h3>
        <p class="text-gray-600 mb-4">Manage your personal and learning profiles.</p>
        <div class="space-y-4">
          <a href="#" class="block text-blue-600 hover:text-blue-800 hover:underline">Complete Profile</a>
          <a href="#" class="block text-blue-600 hover:text-blue-800 hover:underline">Edit Profile</a>
          <a href="#" class="block text-blue-600 hover:text-blue-800 hover:underline">Change Password</a>
        </div>
      </div>
      <!-- My Courses -->
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-xl font-semibold text-blue-800 mb-4">My Courses</h3>
        <p class="text-gray-600 mb-4">Track your enrolled courses and progress.</p>
        <div class="space-y-4">
          <a href="#" class="block text-blue-600 hover:text-blue-800 hover:underline">View Enrolled Courses</a>
          <a href="#" class="block text-blue-600 hover:text-blue-800 hover:underline">Course Progress</a>
          <a href="#" class="block text-blue-600 hover:text-blue-800 hover:underline">Certificates</a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
